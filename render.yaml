services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: rajani-diet-backend
    runtime: docker
    dockerfilePath: ./FastAPI_Backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080

  # ── Streamlit Frontend ───────────────────────────────────────────────────────
  - type: web
    name: rajani-diet-frontend
    runtime: docker
    dockerfilePath: ./Streamlit_Frontend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BACKEND_URL
        value: https://rajani-diet-backend.onrender.com
